name: JensenStore CI/CD

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-build-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-missing.txt

      # TODO 1: Add a step that runs the existing verification with pytest.
      - name: Verify application
        run: python -m pytest -q 

      # TODO 2: Add a step that builds the Docker image.

      # TODO 3: Log in to GHCR and push the image.
